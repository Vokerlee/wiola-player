name: CI

on:
  # Nothing here builds prose, so a pull request that only writes it waits for nothing.
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - assets/**
      - LICENSE
      - .gitignore
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  linux:
    uses: ./.github/workflows/linux.yml

  tsan:
    uses: ./.github/workflows/tsan.yml

  windows:
    uses: ./.github/workflows/windows.yml

  coverage:
    uses: ./.github/workflows/coverage.yml
    permissions:
      contents: read
      pages: write
      id-token: write
