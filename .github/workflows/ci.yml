name: CI

on:
  # Nothing here builds prose, so a pull request that only writes it waits for nothing.
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - assets/**
      - LICENSE
      - .gitignore
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 -m scripts.formatting format cpp --check
      - run: python3 -m scripts.formatting format cmake --check
      - run: python3 -m unittest discover -s scripts -t . -p 'test_*.py'

  test:
    name: test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      # One sanitizer failing is not a reason to stop hearing from the others.
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-asan, linux-tsan]
        include:
          # A race that needs a scheduler accident will not show up in one run of the suite.
          - preset: linux-tsan
            ctest_args: --repeat until-fail:3
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          name: ${{ matrix.preset }}
          packages: ${{ matrix.preset == 'linux-tsan' && 'libglib2.0-dev' || '' }}
      - name: Identify the instrumented Qt build context
        id: tsan-qt-context
        if: matrix.preset == 'linux-tsan'
        run: |
          identity="$(python3 -m scripts.qt.tsan --identity)"
          [[ "$identity" =~ ^[[:xdigit:]]{64}$ ]]
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "workspace=$RUNNER_TEMP/qt-core-tsan" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: tsan-qt
        if: matrix.preset == 'linux-tsan'
        with:
          path: ${{ steps.tsan-qt-context.outputs.workspace }}/runtime
          key: qt-core-tsan-${{ runner.os }}-${{ runner.arch }}-${{ steps.tsan-qt-context.outputs.identity }}
      - name: Build the matching instrumented Qt event dispatcher
        if: matrix.preset == 'linux-tsan'
        run: |
          python3 -m scripts.qt.tsan "$WIOLA_QT_TSAN_WORKSPACE"
          echo "WIOLA_QT_PLUGIN_PATH=$(qtpaths6 --plugin-dir)" >> "$GITHUB_ENV"
        env:
          WIOLA_QT_TSAN_WORKSPACE: ${{ steps.tsan-qt-context.outputs.workspace }}
      - name: Save the qualified Core before testing
        if: matrix.preset == 'linux-tsan' && steps.tsan-qt.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.tsan-qt-context.outputs.workspace }}/runtime
          key: ${{ steps.tsan-qt.outputs.cache-primary-key }}
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} -j
      - run: cmake --build --preset ${{ matrix.preset }} --target wiola_core_adapter_boundary
      - name: Record the instrumented Qt runtime
        if: matrix.preset == 'linux-tsan'
        run: cmake --build --preset ${{ matrix.preset }} --target wiola_verify_tsan_runtime
        env:
          WIOLA_QT_CORE_RUNTIME: ${{ steps.tsan-qt-context.outputs.workspace }}/runtime
      - name: Run offscreen GUI command journeys
        run: ctest --preset ${{ matrix.preset }} --no-tests=error --timeout 120 --output-on-failure -R '^(MainWindowTest|DesktopJourney)\.' ${{ matrix.ctest_args }}
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ matrix.preset == 'linux-tsan' && format('{0}/runtime', steps.tsan-qt-context.outputs.workspace) || '' }}
          QT_PLUGIN_PATH: ${{ env.WIOLA_QT_PLUGIN_PATH }}
          WIOLA_GUI_FAILURE_ARTIFACTS: ${{ github.workspace }}/build-${{ matrix.preset }}/gui-artifacts
      - run: ctest --preset ${{ matrix.preset }} --no-tests=error --timeout 120 ${{ matrix.ctest_args }}
        env:
          LD_LIBRARY_PATH: ${{ matrix.preset == 'linux-tsan' && format('{0}/runtime', steps.tsan-qt-context.outputs.workspace) || '' }}
          QT_PLUGIN_PATH: ${{ env.WIOLA_QT_PLUGIN_PATH }}
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.preset }}
          path: |
            build-*/Testing/Temporary
            build-*/Testing/qt-runtime.txt
            build-*/gui-artifacts
            ${{ steps.tsan-qt-context.outputs.workspace }}/runtime/receipt.json
            ${{ steps.tsan-qt-context.outputs.workspace }}/*.log
          if-no-files-found: ignore
          retention-days: 7

  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          name: headless
          qt: "false"
          build-dir: build-headless
      - run: cmake --preset linux-headless
      - run: cmake --build --preset linux-headless -j
      - run: ctest --preset linux-headless --no-tests=error

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          name: linux-release
          build-dir: build-release
      - run: cmake --preset linux-release
      - run: cmake --build --preset linux-release -j

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          name: windows
          build-dir: build-win-release
          packages: g++-mingw-w64-x86-64-posix llvm ninja-build curl
      - name: Identify the Qt SDK toolchain
        id: qt-context
        run: |
          identity="$(cmake -P scripts/qt/windows/context.cmake)"
          [[ "$identity" =~ ^[[:xdigit:]]{64}$ ]]
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: qt-mingw
        with:
          path: .qt-mingw
          key: qt-mingw-${{ runner.os }}-${{ runner.arch }}-${{ steps.qt-context.outputs.identity }}-${{ hashFiles('scripts/qt/windows/build.sh', 'scripts/qt/windows/context.cmake', 'cmake/mingw-w64.cmake') }}
      - name: Build the static Qt SDK outside its install tree
        if: steps.qt-mingw.outputs.cache-hit != 'true'
        run: ./scripts/qt/windows/build.sh "$GITHUB_WORKSPACE/.qt-mingw" "$RUNNER_TEMP/qt-mingw-build"
      - name: Save the installed SDK before building the player
        if: steps.qt-mingw.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v4
        with:
          path: .qt-mingw
          key: ${{ steps.qt-mingw.outputs.cache-primary-key }}
      - run: cmake --preset windows-release -DENABLE_UNIT_TESTS=ON -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
        env:
          QT_MINGW_ROOT: ${{ github.workspace }}/.qt-mingw
      - run: cmake --build --preset windows-release --parallel 4 --target wiola-player gui_desktop_journey_test gui_metadata_file_journey_test
        env:
          QT_MINGW_ROOT: ${{ github.workspace }}/.qt-mingw
      - name: Install the native test package
        run: cmake --install build-win-release --component wiola_desktop_tests --prefix windows-test-package
      - name: Check static Windows imports
        run: |
          imports="$(llvm-objdump -p windows-test-package/bin/wiola-player.exe)"
          if grep -Eiq 'Qt6.*\.dll|libgcc.*\.dll|libstdc\+\+.*\.dll|libwinpthread.*\.dll|libav.*\.dll|libswresample.*\.dll' <<< "$imports"; then
            echo "Unexpected non-system runtime import" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-journeys
          path: windows-test-package/

  windows-native:
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-desktop-journeys
          path: native-journey
      - name: Run the packaged C++ tests
        timeout-minutes: 5
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $ErrorActionPreference = 'Stop'
          $package = (Resolve-Path native-journey).Path
          $env:WIOLA_JOURNEY_MEDIA_DIR = Join-Path $package 'media'
          $env:WIOLA_TEST_PLAYER = Join-Path $package 'bin/wiola-player.exe'
          function Run-Contracts($binary, $filter, $name) {
            $directory = Join-Path $package "results/$name"
            New-Item -ItemType Directory -Force $directory | Out-Null
            $env:WIOLA_GUI_FAILURE_ARTIFACTS = $directory
            $xml = Join-Path $directory 'tests.xml'
            & (Join-Path $package "bin/$binary.exe") "--gtest_filter=$filter" "--gtest_output=xml:$xml"
            if ($LASTEXITCODE -ne 0) { throw "$binary failed: $LASTEXITCODE" }
            [xml]$report = Get-Content -Raw $xml
            if ($report.SelectNodes('//testcase').Count -eq 0 -or
                $report.SelectNodes('//skipped | //failure | //error | //testcase[@status="notrun"]').Count -ne 0) {
              throw "$binary produced empty, skipped or failing test results"
            }
          }
          Run-Contracts 'gui_desktop_journey_test' 'DesktopJourney.*' 'state'
          Run-Contracts 'gui_metadata_file_journey_test' 'QualifiedFormats/*' 'metadata'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-journey-results
          path: native-journey/results

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # All of it, since what a pull request changed is measured against where it started.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/setup-build
        with:
          name: coverage
          build-dir: build-coverage
          packages: llvm-18
      - run: cmake --preset linux-coverage
        env:
          CXX: clang++-18
      - run: cmake --build --preset linux-coverage --parallel 4
      - run: cmake --build --preset linux-coverage --target wiola_coverage_inventory --parallel 4
      - name: Collect compiler coverage reports
        run: python3 -m scripts.coverage --build-dir build-coverage --source src --exclude '/tests/'
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Upload coverage test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-diagnostics
          path: build-coverage/Testing/Temporary
          if-no-files-found: ignore
          retention-days: 7
      # The numbers, on the run's own page.
      - run: |
          {
            echo '### Coverage'
            echo '```'
            cat build-coverage/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # What this pull request itself left untested, which a total is too blunt to show.
      - if: github.event_name == 'pull_request'
        run: |
          diff-cover build-coverage/coverage/coverage.lcov \
            --compare-branch "origin/${{ github.base_ref }}" \
            --fail-under=100 --format "markdown:diff-coverage.md"
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-coverage/coverage/html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-evidence
          path: |
            build-coverage/coverage/summary.json
            build-coverage/coverage/summary.txt
            build-coverage/coverage/coverage.lcov
            build-coverage/coverage/coverage.profdata
            build-coverage/coverage/raw-*/
      # Only from main: what a pull request measured is its own, and does not replace the report.
      # The report takes a path of its own, leaving the root for whatever is put there later.
      - if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/coverage
          cp -r build-coverage/coverage/html/. site/coverage/
          printf '<meta http-equiv="refresh" content="0; url=coverage/">\n' > site/index.html
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: coverage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
