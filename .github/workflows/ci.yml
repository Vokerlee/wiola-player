name: CI

on:
  # Nothing here builds prose, so a pull request that only writes it waits for nothing.
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - assets/**
      - LICENSE
      - .gitignore
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ./scripts/format-cpp.sh --check
      - run: ./scripts/format-cmake.sh --check
      - run: python3 -m unittest discover -s tests/scripts -v
      - run: python3 -m unittest discover -s tools -t . -p 'test_*.py'
      - run: python3 -m tools.architecture.commands.check_ownership
      - run: python3 -m tools.architecture.commands.check_dependencies
      - run: python3 -m tools.architecture.commands.check_design

  test:
    name: test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      # One sanitizer failing is not a reason to stop hearing from the others.
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-asan, linux-tsan]
        include:
          # A race that needs a scheduler accident will not show up in one run of the suite.
          - preset: linux-tsan
            ctest_args: --repeat until-fail:3
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          name: ${{ matrix.preset }}
          packages: ${{ matrix.preset == 'linux-tsan' && 'libglib2.0-dev' || '' }}
      - uses: actions/cache@v4
        if: matrix.preset == 'linux-tsan'
        with:
          path: build-tsan/qt-core-tsan/runtime
          key: qt-core-tsan-${{ runner.arch }}-${{ hashFiles('scripts/build-qt-core-tsan.sh') }}
      - name: Build the matching instrumented Qt event dispatcher
        if: matrix.preset == 'linux-tsan'
        run: |
          scripts/build-qt-core-tsan.sh build-tsan/qt-core-tsan
          echo "WIOLA_QT_PLUGIN_PATH=$(qtpaths6 --plugin-dir)" >> "$GITHUB_ENV"
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} -j
      - run: cmake --build --preset ${{ matrix.preset }} --target wiola_check_test_contracts
      - run: cmake --build --preset ${{ matrix.preset }} --target wiola_core_adapter_boundary
      - name: Record the instrumented Qt runtime
        if: matrix.preset == 'linux-tsan'
        run: |
          mkdir -p build-tsan/Testing
          ldd build-tsan/tests/gui/gui_desktop_journey_test > build-tsan/Testing/qt-runtime.txt
          grep -F "$GITHUB_WORKSPACE/build-tsan/qt-core-tsan/runtime/libQt6Core.so.6" build-tsan/Testing/qt-runtime.txt
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build-tsan/qt-core-tsan/runtime
      - name: Run offscreen GUI command journeys
        run: ctest --preset ${{ matrix.preset }} --no-tests=error --timeout 120 --output-on-failure -R '^(MainWindowTest|DesktopJourney)\.' ${{ matrix.ctest_args }}
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ matrix.preset == 'linux-tsan' && format('{0}/build-tsan/qt-core-tsan/runtime', github.workspace) || '' }}
          QT_PLUGIN_PATH: ${{ env.WIOLA_QT_PLUGIN_PATH }}
          WIOLA_GUI_FAILURE_ARTIFACTS: ${{ github.workspace }}/build-${{ matrix.preset }}/gui-artifacts
      - run: ctest --preset ${{ matrix.preset }} --no-tests=error --timeout 120 ${{ matrix.ctest_args }}
        env:
          LD_LIBRARY_PATH: ${{ matrix.preset == 'linux-tsan' && format('{0}/build-tsan/qt-core-tsan/runtime', github.workspace) || '' }}
          QT_PLUGIN_PATH: ${{ env.WIOLA_QT_PLUGIN_PATH }}
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.preset }}
          path: |
            build-*/Testing/Temporary
            build-*/Testing/qt-runtime.txt
            build-*/gui-artifacts
            build-tsan/qt-core-tsan/runtime/receipt.json
            build-tsan/qt-core-tsan/*.log
          if-no-files-found: ignore
          retention-days: 7

  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          name: headless
          qt: "false"
          build-dir: build-headless
      - run: cmake --preset linux-headless
      - run: cmake --build --preset linux-headless -j
      - run: cmake --build --preset linux-headless -j --target wiola_model_boundary
      - run: build-headless/bin/wiola_model_boundary

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          name: linux-release
          build-dir: build-release
      - run: cmake --preset linux-release
      - run: cmake --build --preset linux-release -j

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          name: windows
          build-dir: build-win-release
          packages: g++-mingw-w64-x86-64-posix llvm ninja-build curl
      - name: Identify the Qt SDK toolchain
        id: qt-context
        run: |
          identity="$(cmake -P tools/sdk/qt_mingw/context.cmake)"
          [[ "$identity" =~ ^[[:xdigit:]]{64}$ ]]
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: qt-mingw
        with:
          path: .qt-mingw
          key: qt-mingw-${{ runner.os }}-${{ runner.arch }}-${{ steps.qt-context.outputs.identity }}-${{ hashFiles('tools/sdk/qt_mingw/build.sh', 'tools/sdk/qt_mingw/context.cmake', 'cmake/mingw-w64.cmake') }}
      - name: Build the static Qt SDK outside its install tree
        if: steps.qt-mingw.outputs.cache-hit != 'true'
        run: ./scripts/build-qt-mingw.sh "$GITHUB_WORKSPACE/.qt-mingw" "$RUNNER_TEMP/qt-mingw-build"
      - name: Save the installed SDK before building the player
        if: steps.qt-mingw.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v4
        with:
          path: .qt-mingw
          key: ${{ steps.qt-mingw.outputs.cache-primary-key }}
      - run: cmake --preset windows-release -DENABLE_UNIT_TESTS=ON -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST
        env:
          QT_MINGW_ROOT: ${{ github.workspace }}/.qt-mingw
      - run: cmake --build --preset windows-release --parallel 4 --target wiola-player gui_desktop_journey_test gui_metadata_file_journey_test
        env:
          QT_MINGW_ROOT: ${{ github.workspace }}/.qt-mingw
      - name: Check static Windows imports
        run: |
          imports="$(llvm-objdump -p build-win-release/bin/wiola-player.exe)"
          if grep -Eiq 'Qt6.*\.dll|libgcc.*\.dll|libstdc\+\+.*\.dll|libwinpthread.*\.dll|libav.*\.dll|libswresample.*\.dll' <<< "$imports"; then
            echo "Unexpected non-system runtime import" >&2
            exit 1
          fi

      - name: Package qualified media fixtures
        run: |
          mkdir -p build-win-release/tests/codec/data
          cp tests/codec/data/{tone.mp3,tone.flac,tone-vorbis.ogg,tone.wav} build-win-release/tests/codec/data/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-journeys
          path: |
            build-win-release/bin/wiola-player.exe
            build-win-release/tests/gui/gui_desktop_journey_test.exe
            build-win-release/tests/gui/gui_metadata_file_journey_test.exe
            build-win-release/tests/codec/data

  windows-native:
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-desktop-journeys
          path: native-journey
      - name: Run the packaged static binary on native Windows
        run: python scripts/run-desktop-journeys.py --binary native-journey/tests/gui/gui_desktop_journey_test.exe --artifacts native-journey/results/state --minimum-tests 8 --media-dir native-journey/tests/codec/data --revision "${{ github.sha }}"
        env:
          QT_QPA_PLATFORM: windows
      - name: Edit qualified files during playback on native Windows
        run: python scripts/run-desktop-journeys.py --binary native-journey/tests/gui/gui_metadata_file_journey_test.exe --artifacts native-journey/results/metadata --media-dir native-journey/tests/codec/data --filter "QualifiedFormats/*" --minimum-tests 4 --revision "${{ github.sha }}"
        env:
          QT_QPA_PLATFORM: windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-journey-results
          path: native-journey/results

  gui-mutations:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
        with:
          name: gui-mutations
          build-dir: build-debug
      - run: cmake --preset linux-debug
      - name: Require assertion evidence for six critical regressions
        run: cmake --build --preset linux-debug --target wiola_check_mutations
        env:
          QT_QPA_PLATFORM: offscreen
          WIOLA_MUTATION_ARTIFACTS: ${{ runner.temp }}/mutation-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-mutation-evidence
          path: ${{ runner.temp }}/mutation-results

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # All of it, since what a pull request changed is measured against where it started.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/setup-build
        with:
          name: coverage
          build-dir: build-coverage
          packages: llvm-18
      - run: ./scripts/coverage.sh
        env:
          CXX: clang++-18
      - name: Reconcile C++ and Python coverage with source ownership
        run: cmake --build --preset linux-coverage --target wiola_coverage_ownership
      - name: Enforce trusted workflow floors and changed decisions
        run: python3 -m scripts.coverage_gate --base-ref "$WIOLA_COVERAGE_BASE"
        env:
          WIOLA_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Upload coverage test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-diagnostics
          path: |
            build-coverage/Testing/Temporary
            build-coverage/coverage/*.log
            build-coverage/coverage/*mapping-diagnostics.txt
            build-coverage/coverage/gate.json
            build-coverage/coverage/owners.json
            build-coverage/coverage/python.json
            build-coverage/coverage/python-manifest.json
            build-coverage/coverage/python-profiles-*/
          if-no-files-found: ignore
          retention-days: 7
      # The numbers, on the run's own page.
      - run: |
          {
            echo '### Coverage'
            echo '```'
            cat build-coverage/coverage/summary.txt
            cat build-coverage/coverage/workflow.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # What this pull request itself left untested, which a total is too blunt to show.
      - if: github.event_name == 'pull_request'
        run: |
          diff-cover build-coverage/coverage/coverage.lcov \
            --compare-branch "origin/${{ github.base_ref }}" \
            --format "markdown:diff-coverage.md"
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-coverage/coverage/html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-evidence
          path: |
            build-coverage/coverage/manifest.json
            build-coverage/coverage/inventory.json
            build-coverage/coverage/summary.json
            build-coverage/coverage/summary.txt
            build-coverage/coverage/workflow.json
            build-coverage/coverage/workflow.txt
            build-coverage/coverage/coverage.lcov
            build-coverage/coverage/workflow.lcov
            build-coverage/coverage/gate.json
            build-coverage/coverage/owners.json
            build-coverage/coverage/python.json
            build-coverage/coverage/python-manifest.json
            build-coverage/coverage/python-profiles-*/
      # Only from main: what a pull request measured is its own, and does not replace the report.
      # The report takes a path of its own, leaving the root for whatever is put there later.
      - if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/coverage
          cp -r build-coverage/coverage/html/. site/coverage/
          printf '<meta http-equiv="refresh" content="0; url=coverage/">\n' > site/index.html
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: coverage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
