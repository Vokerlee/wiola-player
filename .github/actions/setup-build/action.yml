name: Set up a build
description: Installs what a build needs and restores what it can reuse.

inputs:
  name:
    description: What the caches belong to, usually the preset.
    required: true
  build-dir:
    description: Where the fetched dependencies land.
    default: build-*
  qt:
    description: Whether this build needs the host Qt development tools.
    default: "true"
  packages:
    description: Anything to install beyond what every build needs.
    default: ""

runs:
  using: composite
  steps:
    # What was fetched, which changes only when the pinned versions do. The build directories
    # beside these belong to one configuration and are left to be made again.
    - uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.build-dir }}/_deps/*-src
          ${{ inputs.build-dir }}/_deps/*-subbuild
        key: deps-${{ inputs.name }}-${{ hashFiles('cmake/dependencies.cmake', 'cmake/ffmpeg.cmake') }}

    # FFmpeg's installed libraries and ExternalProject stamps must agree for its build to be
    # skipped. The object directory is deliberately excluded: it is the largest part and can be
    # recreated if a step ever needs to run again.
    - uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.build-dir }}/_deps/ffmpeg-download
          ${{ inputs.build-dir }}/_deps/ffmpeg-install
          ${{ inputs.build-dir }}/wiola_ffmpeg_build-prefix
          ${{ inputs.build-dir }}/CMakeFiles/wiola_ffmpeg_build-complete
        key: ffmpeg-${{ inputs.name }}-${{ hashFiles('cmake/ffmpeg.cmake', 'cmake/mingw-w64.cmake') }}

    # What was compiled last time. Keyed by commit so every run leaves one, and restored from
    # whichever of this name's is newest.
    - uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ inputs.name }}-${{ github.sha }}
        restore-keys: ccache-${{ inputs.name }}-

    - name: Resolve host package archives
      id: apt-plan
      shell: bash
      env:
        WIOLA_HOST_QT: ${{ inputs.qt }}
        WIOLA_EXTRA_PACKAGES: ${{ inputs.packages }}
      run: |
        packages=(ccache)
        case "$WIOLA_HOST_QT" in
          true) packages+=(qt6-base-dev qt6-qpa-plugins) ;;
          false) ;;
          *) echo "qt must be true or false" >&2; exit 1 ;;
        esac
        read -r -a extra <<< "$WIOLA_EXTRA_PACKAGES"
        packages+=("${extra[@]}")
        sudo apt-get -o Acquire::Retries=3 update
        plan_dir="$(mktemp -d "$RUNNER_TEMP/apt-plan.XXXXXX")"
        identity="$(sudo env LC_ALL=C apt-get --yes --print-uris --download-only \
          --no-install-recommends -o "Dir::Cache::archives=$plan_dir" \
          install -- "${packages[@]}" | \
          awk '/\.deb[[:space:]]+[0-9]+[[:space:]]+/ {print $2, $3, $4}' | sort | sha256sum)"
        echo "identity=${identity%% *}" >> "$GITHUB_OUTPUT"
        echo "packages=${packages[*]}" >> "$GITHUB_OUTPUT"

    - name: Restore package archives
      id: apt-cache
      uses: actions/cache/restore@v4
      with:
        path: .cache/ubuntu-packages/*.deb
        key: ubuntu-archives-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt-plan.outputs.identity }}

    - name: Install host packages
      shell: bash
      env:
        WIOLA_PACKAGES: ${{ steps.apt-plan.outputs.packages }}
      run: |
        read -r -a packages <<< "$WIOLA_PACKAGES"
        archives="$GITHUB_WORKSPACE/.cache/ubuntu-packages"
        sudo install -d -m 0755 -o _apt "$archives"
        sudo env DEBIAN_FRONTEND=noninteractive apt-get --yes --no-install-recommends \
          -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
          -o "Dir::Cache::archives=$archives" install -- "${packages[@]}"

    - name: Save package archives before building
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .cache/ubuntu-packages/*.deb
        key: ${{ steps.apt-cache.outputs.cache-primary-key }}

    - name: Configure compiler cache environment
      shell: bash
      run: |
        {
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache"
          echo "CCACHE_MAXSIZE=500M"
        } >> "$GITHUB_ENV"
